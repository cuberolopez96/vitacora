name: Docker image build (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t vitacora-backend:pr -f backend/Dockerfile backend

      - name: Check frontend Dockerfile exists
        id: check_frontend_docker
        run: |
          if [ -f frontend/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend image
        if: ${{ steps.check_frontend_docker.outputs.exists == 'true' }}
        run: |
          docker build -t vitacora-frontend:pr -f frontend/Dockerfile frontend

      - name: Verify images
        run: |
          docker images | grep vitacora || true
