name: Encryption PoC

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  encryption-poc:
    name: Backup encryption PoC
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Prepare data directory (create placeholder DB)
        run: |
          mkdir -p data
          if [ ! -f data/vitacora.sqlite ]; then
            # create a small placeholder file; not a full sqlite DB but sufficient for PoC backup/restore flow
            echo "poc-placeholder-$(date +%s)" > data/vitacora.sqlite
          fi

      - name: Generate ephemeral key
        run: |
          node scripts/generate_key.js
          ls -la keys

      - name: Create compressed backup (Node PoC)
        run: |
          node scripts/node_backup.js
          ls -la backups | tail -n 5

      - name: Encrypt latest backup
        run: |
          BACKUP_FILE=$(ls -1 backups | tail -n 1)
          echo "Backup file: $BACKUP_FILE"
          node scripts/node_encrypt.js keys/test.key "backups/$BACKUP_FILE"
          ls -la backups | tail -n 5

      - name: Decrypt latest .enc backup
        run: |
          ENC_FILE=$(ls -1 backups/*.enc | tail -n 1)
          echo "Enc file: $ENC_FILE"
          node scripts/node_decrypt.js keys/test.key "$ENC_FILE"
          ls -la backups | tail -n 5

      - name: Prepare restore file and run restore
        run: |
          # Find a candidate restore file. Prefer decrypted .dec, then .enc, then latest non-.sha256 backup
          set -euo pipefail
          DEC=$(ls -1 backups/*.dec 2>/dev/null | tail -n 1 || true)
          if [ -n "$DEC" ]; then
            RESTORE_FILE="$DEC"
            echo "Found decrypted file: $RESTORE_FILE"
          else
            ENC=$(ls -1 backups/*.enc 2>/dev/null | tail -n 1 || true)
            if [ -n "$ENC" ]; then
              RESTORE_FILE="$ENC"
              echo "Found encrypted backup: $RESTORE_FILE"
            else
              LATEST=$(ls -1 backups | grep -v '\.sha256$' | tail -n 1 || true)
              if [ -z "$LATEST" ]; then
                echo "No backup files found in backups/"; exit 2
              fi
              RESTORE_FILE="backups/$LATEST"
              echo "Falling back to latest backup: $RESTORE_FILE"
            fi
          fi

          echo "Restoring from $RESTORE_FILE"
          # Normalize names: handle cases like filename.sha256.dec -> filename
          if [[ "$RESTORE_FILE" == *.sha256.dec ]]; then
            TARGET="${RESTORE_FILE%.sha256.dec}"
            echo "Normalizing $RESTORE_FILE -> $TARGET"
            mv "$RESTORE_FILE" "$TARGET" || true
            RESTORE_FILE="$TARGET"
          elif [[ "$RESTORE_FILE" == *.dec ]]; then
            TARGET="${RESTORE_FILE%.dec}"
            echo "Stripping .dec: $RESTORE_FILE -> $TARGET"
            mv "$RESTORE_FILE" "$TARGET" || true
            RESTORE_FILE="$TARGET"
          elif [[ "$RESTORE_FILE" == *.sha256 ]]; then
            TARGET="${RESTORE_FILE%.sha256}"
            if [ -f "$TARGET" ]; then
              echo "Found .sha256 and corresponding file exists. Using $TARGET"
              RESTORE_FILE="$TARGET"
            fi
          fi

          export RESTORE_FILE
          export DB_CONNECTION="./data/vitacora_ci_restore.sqlite"
          export ENCRYPTION_ENABLED=true
          export ENCRYPTION_KEY_PATH=keys/test.key
          ./scripts/restore.sh
          ls -la data

      - name: Validate restore
        run: |
          if [ ! -f "data/vitacora_ci_restore.sqlite" ]; then
            echo "Restore failed: file not found"; ls -la data; exit 1
          fi
          echo "Restore file exists:"; ls -la data/vitacora_ci_restore.sqlite

      - name: Success
        run: |
          echo encryption-poc: OK
