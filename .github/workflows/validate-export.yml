name: Validate export (smoke)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install jq (for JSON checks)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install backend deps
        run: |
          cd backend
          npm install --no-audit --no-fund

      - name: Prepare env and DB (for sqlite)
        run: |
          # Ensure root and backend env files exist
          cp .env.sample .env || true
          cp .env.sample backend/.env || true

          # Ensure SQLite storage dirs exist and files that knex expects
          mkdir -p data backend/data
          if [ ! -f data/vitacora.sqlite ]; then
            touch data/vitacora.sqlite
          fi
          if [ ! -f backend/data/test-ci.sqlite ]; then
            touch backend/data/test-ci.sqlite
          fi

          # Configure env files to use sqlite
          sed -i 's/^DB_CLIENT=.*/DB_CLIENT=sqlite3/' .env || true
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=./data/vitacora.sqlite|' .env || true
          sed -i 's/^DB_CLIENT=.*/DB_CLIENT=sqlite3/' backend/.env || true
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=./data/test-ci.sqlite|' backend/.env || true

          echo "Files created:"
          ls -la data || true
          ls -la backend/data || true

      - name: Show knex filename (debug)
        run: |
          cd backend
          node -e "console.log(require('./knexfile').development.connection.filename)"

      - name: Run migrations
        run: |
          cd backend
          npm run migrate

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Start backend (dev)
        run: |
          cd backend
          NODE_ENV=development AUTH_ENABLED=false node src/server.js &
          sleep 5

      - name: Validate export endpoint
        run: |
          set -e
          # Try export as JSON
          curl -f -sS http://localhost:8080/api/export -o /tmp/export.json
          # Ensure JSON has exported_at and data keys
          cat /tmp/export.json | jq -e '.exported_at and .data' >/dev/null
