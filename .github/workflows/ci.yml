name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Prepare environment for tests
        run: |
          # Ensure project and backend .env exist and are configured for sqlite
          cp .env.sample .env || true
          cp .env.sample backend/.env || true

          # Ensure SQLite storage dirs exist (both project_root/data and backend/data)
          mkdir -p data backend/data

          # create empty sqlite files so knex/migrations and tests can open them
          if [ ! -f data/vitacora.sqlite ]; then
            touch data/vitacora.sqlite
          fi
          if [ ! -f backend/data/vitacora.sqlite ]; then
            touch backend/data/vitacora.sqlite
          fi
          if [ ! -f backend/data/test-ci.sqlite ]; then
            touch backend/data/test-ci.sqlite
          fi

          # Show created files for debugging
          ls -la data || true
          ls -la backend/data || true

          # Configure env files to use sqlite
          sed -i 's/^DB_CLIENT=.*/DB_CLIENT=sqlite3/' .env || true
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=./data/vitacora.sqlite|' .env || true
          sed -i 's/^DB_CLIENT=.*/DB_CLIENT=sqlite3/' backend/.env || true
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=./data/test-ci.sqlite|' backend/.env || true

          # Export variables for steps that read env vars directly
          export DB_CLIENT=sqlite3
          export DB_CONNECTION=../data/vitacora.sqlite

      - name: Ensure knex DB file exists (debug)
        run: |
          echo "Resolving knex sqlite filename via backend/knexfile.js"
          DBFILE=$(node -e "console.log(require('./backend/knexfile').development.connection.filename)") || true
          echo "Knex DB file resolved: $DBFILE"
          if [ -z "$DBFILE" ]; then
            echo "DBFILE empty — defaulting to ./data/vitacora.sqlite"
            DBFILE=$(pwd)/data/vitacora.sqlite
          fi
          DIR=$(dirname "$DBFILE")
          echo "Creating dir: $DIR"
          mkdir -p "$DIR"
          if [ ! -f "$DBFILE" ]; then
            echo "Touching $DBFILE"
            touch "$DBFILE"
          fi
          ls -la "$DIR"

      - name: Run migrations
        working-directory: backend
        run: npm run migrate

      - name: Run tests
        working-directory: backend
        run: npm test

  export-verification:
    name: Export verification (E2E)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.sample backend/.env || true
          # Ensure SQLite storage dir exists
          mkdir -p backend/data
          # Use sqlite for CI validation
          sed -i 's/^DB_CLIENT=.*/DB_CLIENT=sqlite3/' backend/.env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=./data/test-ci.sqlite|' backend/.env || true

      - name: Ensure knex DB file exists (export job)
        run: |
          echo "Resolving knex sqlite filename via backend/knexfile.js"
          DBFILE=$(node -e "console.log(require('./backend/knexfile').development.connection.filename)") || true
          echo "Knex DB file resolved: $DBFILE"
          if [ -z "$DBFILE" ]; then
            echo "DBFILE empty — defaulting to ./data/test-ci.sqlite"
            DBFILE=$(pwd)/backend/data/test-ci.sqlite
          fi
          DIR=$(dirname "$DBFILE")
          echo "Creating dir: $DIR"
          mkdir -p "$DIR"
          if [ ! -f "$DBFILE" ]; then
            echo "Touching $DBFILE"
            touch "$DBFILE"
          fi
          ls -la "$DIR"

      - name: Run migrations
        working-directory: backend
        run: npm run migrate

      - name: Start backend
        working-directory: backend
        run: |
          set -euo pipefail
          nohup npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid || true
          echo "Waiting for backend to become healthy (max 60s)..."
          attempt=0
          max_attempts=12
          until curl -sf http://localhost:8080/api/healthz >/dev/null 2>&1; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Backend did not become healthy in time. Tail backend log:" 
              tail -n 50 /tmp/backend.log || true
              exit 1
            fi
            sleep 5
          done
          echo "healthz OK"

      - name: Generate full fixture (optional)
        working-directory: .
        run: |
          mkdir -p fixtures/exports
          cat > fixtures/exports/generate_1k.js <<'JSCODE'
          const fs=require('fs');
          const out=[];
          for(let i=0;i<1000;i++){
            out.push({
              userId: `user-${(i%10)+1}`,
              habitId: `habit-${(i%50)+1}`,
              date: `2026-01-${((i%28)+1).toString().padStart(2,'0')}`,
              status: ['completed','missed','skip'][i%3],
              note: `auto ${i}`
            });
          }
          fs.writeFileSync('fixtures/exports/1k-records.json', JSON.stringify(out));
          JSCODE
          node fixtures/exports/generate_1k.js

      - name: Run export and validate CSV headers
        working-directory: .
        run: |
          echo "Running export..."
          curl -sf -o export.csv "http://localhost:8080/api/export?format=csv" || (echo "Export failed" && tail -n 200 /tmp/backend.log && exit 1)

          # Normalize headers: convert snake_case to camelCase, then check required fields
          cat > /tmp/check_csv.js <<'JSCODE'
                  const fs = require('fs');
                  const hdr = fs.readFileSync('export.csv','utf8').split('\n')[0].trim().replace(/\r$/,'');
                  const expected = 'userId,habitId,date,status,note';
                  if (hdr !== expected) {
                    console.error('CSV header mismatch. Found:', hdr);
                    console.error('Expected exact header:', expected);
                    process.exit(2);
                  }
                  console.log('CSV headers OK');
                  JSCODE

                  node /tmp/check_csv.js

      - name: Success
        run: |
          echo export-verification: OK

  image-size:
    name: Image size check
    runs-on: ubuntu-latest
    needs: [test, export-verification]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image (if present)
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "Building backend image..."
            docker build -t vitacora-backend:ci -f backend/Dockerfile backend
          else
            echo "No backend/Dockerfile found; skipping backend image build"
          fi

      - name: Build frontend image (if present)
        run: |
          if [ -f frontend/Dockerfile ]; then
            echo "Building frontend image..."
            docker build -t vitacora-frontend:ci -f frontend/Dockerfile frontend
          else
            echo "No frontend/Dockerfile found; skipping frontend image build"
          fi

      - name: Check image sizes
        run: |
          set -euo pipefail
          THRESH_WARN=$((200*1024*1024))
          THRESH_FAIL=$((350*1024*1024))

          check_image() {
            local tag="$1"
            id=$(docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v t="$tag" '$1==t{print $2; exit}')
            if [ -z "$id" ]; then
              echo "Image $tag not found; skipping"
              return 0
            fi
            size=$(docker image inspect --format='{{.Size}}' "$id")
            size_mb=$(awk "BEGIN {printf \"%.2f\", $size/1024/1024}")
            echo "$tag size: ${size_mb} MB"
            if [ "$size" -ge "$THRESH_FAIL" ]; then
              echo "$tag exceeds fail threshold ($((THRESH_FAIL/1024/1024))MB)"
              return 1
            elif [ "$size" -ge "$THRESH_WARN" ]; then
              echo "WARNING: $tag is ${size_mb}MB (over $((THRESH_WARN/1024/1024))MB target)"
              echo "::warning::$tag size is ${size_mb}MB (target $((THRESH_WARN/1024/1024))MB)"
            fi
            return 0
          }

          check_image vitacora-backend:ci || exit 1
          check_image vitacora-frontend:ci || exit 1
