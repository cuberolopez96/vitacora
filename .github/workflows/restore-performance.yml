name: Restore performance test (stub)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"  # daily at 03:00 UTC
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  restore-perf:
    name: Restore performance (stub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x ./scripts/test_restore_performance.sh || true

      - name: Run restore performance test (stub)
        run: |
          set -e
          FIXTURE=tests/fixtures/50MB.sqlite
          if [ -f "$FIXTURE" ]; then
            echo "Fixture found: $FIXTURE"
            ./scripts/test_restore_performance.sh "$FIXTURE" "cp $FIXTURE restored.sqlite"
          else
            echo "Fixture $FIXTURE not found — generating sanitized ~50MB fixture"
            chmod +x ./scripts/generate_sqlite_50mb_fixture.sh || true
            ./scripts/generate_sqlite_50mb_fixture.sh "$FIXTURE"
            if [ -f "$FIXTURE" ]; then
              echo "Generated fixture: $FIXTURE"
              ./scripts/test_restore_performance.sh "$FIXTURE" "cp $FIXTURE restored.sqlite"
            else
              echo "Failed to generate fixture; skipping test"
            fi
          fi
